<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I am So Sorry! ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
      position: relative;
    }
    h1 {
      color: #e63946;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }
    .main-text {
      color: #2b2d42;
      font-size: 1.2rem;
      margin: 15px 0;
      line-height: 1.6;
      font-weight: 600;
    }
    .sub-text {
      color: #555;
      font-size: 1rem;
      margin-bottom: 25px;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      position: relative;
      min-height: 50px;
    }
    button {
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-yes {
      background-color: #2a9d8f;
      color: white;
    }
    .btn-yes:hover {
      background-color: #21867a;
      transform: scale(1.05);
    }
    .btn-no {
      background-color: #e76f51;
      color: white;
      position: absolute;
    }
    .hidden-message {
      display: none;
      margin-top: 25px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 10px;
      color: #2e7d32;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>I am Really Sorry! 🥺</h1>
    
    <p class="main-text">
      "If I did anything wrong, I am truly sorry... <br>
      It really doesn't feel right when you are mad at me."
    </p>

    <p class="sub-text">
      Our friendship means the world to me. Please forgive me! ❤️
    </p>

    <div class="btn-group">
      <button class="btn-yes" onclick="forgiveMe()">I Forgive You! 🥰</button>
      <button class="btn-no" id="noBtn" onmouseover="moveButton()">Still Angry! 😡</button>
    </div>

    <div class="hidden-message" id="happyMsg">
      Yayyy! Thank you so much! 🎉<br>
      Now give me a smile and message me back! 😄💖
    </div>
  </div>

  <script>
    function moveButton() {
      const btn = document.getElementById('noBtn');
      // Moves the button randomly when mouse hovers over it
      const x = Math.random() * (window.innerWidth - 150) - (window.innerWidth / 2 - 100);
      const y = Math.random() * (window.innerHeight - 150) - (window.innerHeight / 2 - 100);
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function forgiveMe() {
      document.getElementById('happyMsg').style.display = 'block';
      document.getElementById('noBtn').style.display = 'none';
    }
  </script>

</body>
</html>
